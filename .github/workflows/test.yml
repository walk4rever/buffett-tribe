name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci
        working-directory: services/pi-gateway
      - run: npm run sync:shared
        working-directory: services/pi-gateway
      - run: npm run lint
      - run: npm run test
        env:
          # Enables the search_filings / search_holdings live-DB golden cases
          # in tests/agent-tools/ (they skip gracefully without it). Deliberately
          # NOT setting OPENAI_API_KEY here — search_wisdom's case needs it but
          # that's a paid per-call API key; adding it to every push/PR run is a
          # separate cost/secrets decision, so that case stays skip-only in CI.
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
