<!doctype html>
<html>
<head>
<meta charset="UTF-8"/>
<title>Air7.fun Logo Preview (Apple Blue #0071e3)</title>
<style>
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif; background: #000; color: #fff; }
  h2 { font-size: 15px; font-weight: 600; letter-spacing: -0.2px; margin: 0 0 16px; color: rgba(255,255,255,0.85); }
  .dark-nav-sim { background: rgba(0,0,0,0.8); backdrop-filter: blur(20px); padding: 16px 28px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); display: inline-flex; align-items: center; gap: 12px; }
  .dark-card { background: #141416; padding: 28px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.08); margin-bottom: 24px; }
  .light-card { background: #f5f5f7; color: #1d1d1f; padding: 28px; border-radius: 16px; }
  .light-card h2 { color: #1d1d1f; }
  .row { display: flex; align-items: center; gap: 40px; flex-wrap: wrap; }
  label { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; margin-top: 8px; opacity: 0.6; }
  .mark { display: flex; flex-direction: column; align-items: center; }
</style>
</head>
<body style="padding: 24px;">

<div class="dark-card">
  <h2>深色导航条环境（实际 Navbar 背景：rgba(0,0,0,0.8)）</h2>
  <div style="margin-bottom: 24px;">
    <div class="dark-nav-sim">
      <img src="/logo.svg" width="24" height="24" alt="nav logo" />
      <span style="font-weight: 600; font-size: 15px; color: #fff;">Value-Tribe</span>
      <span style="color: rgba(255,255,255,0.4); margin: 0 8px;">|</span>
      <span style="color: rgba(255,255,255,0.7); font-size: 13px;">大师</span>
      <span style="color: rgba(255,255,255,0.7); font-size: 13px;">公司</span>
      <span style="color: rgba(255,255,255,0.7); font-size: 13px;">洞见</span>
      <span style="color: rgba(255,255,255,0.7); font-size: 13px;">投研</span>
    </div>
  </div>

  <h2>多尺寸预览（Apple Blue #0071e3 + 纯白折线）</h2>
  <div class="row">
    <div class="mark">
      <img src="/logo.svg" width="24" height="24" alt="logo 24px" />
      <label>24px (Nav)</label>
    </div>
    <div class="mark">
      <img src="/logo.svg" width="32" height="32" alt="logo 32px" />
      <label>32px (Icon)</label>
    </div>
    <div class="mark">
      <img src="/logo.svg" width="48" height="48" alt="logo 48px" />
      <label>48px</label>
    </div>
    <div class="mark">
      <img src="/logo.svg" width="64" height="64" alt="logo 64px" />
      <label>64px (2x)</label>
    </div>
    <div class="mark">
      <img src="/logo.svg" width="128" height="128" alt="logo 128px" />
      <label>128px (App Icon)</label>
    </div>
  </div>
</div>

<div class="light-card">
  <h2>浅色页面环境对比</h2>
  <div class="row">
    <div class="mark">
      <img src="/logo.svg" width="24" height="24" alt="logo 24px" />
      <label>24px</label>
    </div>
    <div class="mark">
      <img src="/logo.svg" width="32" height="32" alt="logo 32px" />
      <label>32px</label>
    </div>
    <div class="mark">
      <img src="/logo.svg" width="64" height="64" alt="logo 64px" />
      <label>64px</label>
    </div>
    <div class="mark">
      <img src="/logo.svg" width="128" height="128" alt="logo 128px" />
      <label>128px</label>
    </div>
  </div>
</div>

</body>
</html>
